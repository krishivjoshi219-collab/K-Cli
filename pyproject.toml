[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k-cli-ai"
version = "1.0.0"
description = "K-CLI: AI-powered agentic developer workstation for the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["ai", "cli", "developer-tools", "github", "agentic", "tui", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Terminals",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "pytest>=8.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
]

[project.scripts]
k-cli = "k_cli.cli:app"

[project.urls]
Homepage = "https://github.com/krishivjoshi219-collab/K-Cli"
Repository = "https://github.com/krishivjoshi219-collab/K-Cli"
Issues = "https://github.com/krishivjoshi219-collab/K-Cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["k_cli*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
